name: Compile Apelin packages alongside regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select hosted Xcode 26.5 for compatibility build
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "BUILD_SDK_TIER=$sdk" >> "$GITHUB_ENV"
          echo "Compatibility build uses SDK $sdk; upstream SDK tier is 27.1."
      - name: Verify and extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          echo '11c5fef259fab375419ae9e88ef39637d308d5738079a5ca8d161c1e24929bce  Apelin-fixed-source.tar.gz' | shasum -a 256 -c -
          mkdir source
          tar -xzf Apelin-fixed-source.tar.gz -C source
          python3 - <<'PY'
          from pathlib import Path
          root = Path('source/Apelin-fixed')
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              data = p.read_bytes()
              script = data.startswith(b'#!')
              if b'\r\n' in data and b'\x00' not in data:
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      pass
                  else:
                      p.write_bytes(data.replace(b'\r\n', b'\n'))
              if script or p.suffix in {'.sh', '.py'}:
                  p.chmod(p.stat().st_mode | 0o111)
          PY
          python3 ci-source-fixes.py
      - name: Restore Swift package build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/Apelin-fixed/Packages/*/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-xcode26.5-${{ github.run_id }}
          restore-keys: swift-xcode26.5-
      - name: Install packaging tools
        run: brew install dpkg ldid zstd
      - name: Check project invariants
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          make check 2>&1 | tee "$GITHUB_WORKSPACE/check.log"
      - name: Build both Debian package flavors
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          make deb-all IOS_SDK_TIER="$BUILD_SDK_TIER" CONFIGURATION=Release SKIP_HARNESS=1 BUILD_NUMBER="$GITHUB_RUN_NUMBER" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          cd build/Packages
          shasum -a 256 ./*.deb > SHA256SUMS-deb
      - name: Save Swift package build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            source/Apelin-fixed/Packages/*/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-xcode26.5-${{ github.run_id }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: '*.log'
          if-no-files-found: ignore
      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: apelin-debs-${{ github.run_number }}
          path: |
            source/Apelin-fixed/build/Packages/*.deb
            source/Apelin-fixed/build/Packages/SHA256SUMS-deb
          if-no-files-found: error
          retention-days: 30
