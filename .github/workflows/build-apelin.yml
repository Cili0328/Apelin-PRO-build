name: Build Apelin packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select hosted Xcode 26.5 for compatibility build
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "BUILD_SDK_TIER=$sdk" >> "$GITHUB_ENV"
          echo "Compatibility build uses SDK $sdk; upstream SDK tier is 27.1."
      - name: Verify and extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          echo '7338dde1dae81b10400cb584d8967a79dd23e02ca258110e65f7e45ebdbbb1d7  Apelin-fixed-source.tar.gz' | shasum -a 256 -c -
          mkdir source
          tar -xzf Apelin-fixed-source.tar.gz -C source
          python3 - <<'PY'
          from pathlib import Path
          root = Path('source/Apelin-fixed')
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              data = p.read_bytes()
              script = data.startswith(b'#!')
              if b'\r\n' in data and b'\x00' not in data:
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      pass
                  else:
                      p.write_bytes(data.replace(b'\r\n', b'\n'))
              if script or p.suffix in {'.sh', '.py'}:
                  p.chmod(p.stat().st_mode | 0o111)
          PY
      - name: Parse Swift sources before dependency builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee syntax.log
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import subprocess
          root = Path('source/Apelin-fixed')
          files = sorted(root.rglob('*.swift'))
          compiler = subprocess.check_output(['xcrun', '--find', 'swiftc'], text=True).strip()
          def parse(path):
              result = subprocess.run([compiler, '-frontend', '-parse', '-enable-bare-slash-regex', str(path)], capture_output=True, text=True)
              return path, result
          failures = 0
          with ThreadPoolExecutor(max_workers=6) as pool:
              for path, result in pool.map(parse, files):
                  if result.returncode:
                      failures += 1
                      print(str(path))
                      print(result.stdout + result.stderr)
          print(f'Swift syntax: {len(files)} files, {failures} failures')
          raise SystemExit(bool(failures))
          PY
      - name: Restore Swift package build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/Apelin-fixed/Packages/*/.build
            ~/Library/Caches/org.swift.swiftpm
            /private/tmp/apelin-deriveddata
          key: swift-xcode26.5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: swift-xcode26.5-
      - name: Install packaging tools
        run: brew install dpkg ldid zstd swiftformat
      - name: Format changed Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          swiftformat Apelin/Interface/Chats/ChatController.swift \
            Apelin/Interface/Chats/ChatModelPickerController.swift \
            Apelin/Interface/Chats/ChatRuntime.swift \
            Apelin/Interface/Chats/Composer/ComposerModelSelection.swift \
            Apelin/Interface/Settings/Accounts/AgentProvider+Display.swift \
            Apelin/Interface/Settings/Accounts/EnabledModels.swift \
            Apelin/Interface/Settings/Accounts/ProviderBalanceHistory.swift \
            Apelin/Interface/Settings/Accounts/ProviderBalanceScreen.swift \
            Apelin/Interface/Settings/Accounts/ProviderKeyFormController.swift \
            Apelin/Interface/Settings/Accounts/ProviderLoginController.swift \
            Apelin/Interface/Settings/Accounts/RelayConfigurationController.swift \
            Apelind/Session/Agent/AgentConversationRules.swift \
            Packages/ApelinAgent/Sources/ApelinAgent/Credentials/RelayCredentialPool.swift \
            Packages/ApelinAgent/Sources/ApelinAgent/Session/AgentSession.swift \
            Packages/ApelinAgent/Sources/ApelinAgent/Session/NetworkRecovery.swift \
            Packages/ApelinAgent/Sources/ApelinAgent/Session/ProviderConfiguration.swift \
            Packages/ApelinAgent/Sources/ApelinAgent/Session/ProviderRegistration.swift \
            Packages/ApelinAgent/Sources/ApelinAgentWorker/AgentWorker.swift \
            Packages/ApelinAgent/Sources/ApelinAgentWorker/ChannelHostBackend+Conversations.swift \
            Packages/ApelinAgent/Sources/ApelinAgentWorker/SessionModelChoice.swift \
            Packages/ApelinAgent/Sources/ApelinAgentWorker/SignIn/AccountDesk.swift \
            Packages/ApelinAgent/Sources/ApelinAgentWorker/SignIn/SignInProviders.swift \
            Packages/ApelinAgent/Tests/ApelinAgentTests/RelayCredentialPoolTests.swift \
            Packages/ApelinAgent/Tests/ApelinAgentWorkerTests/RelayAccountDeskTests.swift \
            Packages/ApelinKit/Sources/ApelinProtocol/Operations/Agent.swift \
            Packages/ApelinKit/Sources/ApelinProtocol/Operations/AgentRelay.swift \
            Packages/ApelinKit/Sources/ApelinProtocol/Operations/AgentSignIn.swift 2>&1 | tee "$GITHUB_WORKSPACE/format.log"
      - name: Check project invariants
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          make check 2>&1 | tee "$GITHUB_WORKSPACE/check.log"
      - name: Run Swift regression harness
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          make harness 2>&1 | tee "$GITHUB_WORKSPACE/harness.log"
      - name: Build both Debian package flavors
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          make deb-all IOS_SDK_TIER="$BUILD_SDK_TIER" CONFIGURATION=Release SKIP_HARNESS=1 BUILD_NUMBER="$GITHUB_RUN_NUMBER" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          cd build/Packages
          shasum -a 256 ./*.deb > SHA256SUMS-deb
      - name: Audit Objective-C selectors
        shell: bash
        run: |
          set -euo pipefail
          cd source/Apelin-fixed
          Scripts/audit-objc-selectors.sh /private/tmp/apelin-deriveddata/Build/Products/Release-iphoneos 2>&1 | tee "$GITHUB_WORKSPACE/selectors.log"
      - name: Preserve matching debug symbols and formatted source
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/source/Apelin-fixed"
          version="$(make -C "$root" --no-print-directory print-version)"
          cd /private/tmp/apelin-deriveddata/Build/Products/Release-iphoneos
          zip -qry "$root/build/Packages/Apelin_${version}_dSYMs.zip" ./*.dSYM
          cd "$GITHUB_WORKSPACE/source"
          tar --exclude='.build' --exclude='build' -czf "$root/build/Packages/Apelin_${version}_Source.tar.gz" Apelin-fixed
          cd "$root/build/Packages"
          shasum -a 256 ./*_dSYMs.zip ./*_Source.tar.gz > SHA256SUMS-support
      - name: Save Swift package build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            source/Apelin-fixed/Packages/*/.build
            ~/Library/Caches/org.swift.swiftpm
            /private/tmp/apelin-deriveddata
          key: swift-xcode26.5-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          overwrite: true
          path: '*.log'
          if-no-files-found: ignore
      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: apelin-debs-${{ github.run_number }}
          path: |
            source/Apelin-fixed/build/Packages/*.deb
            source/Apelin-fixed/build/Packages/SHA256SUMS-deb
            source/Apelin-fixed/build/Packages/*_dSYMs.zip
            source/Apelin-fixed/build/Packages/*_Source.tar.gz
            source/Apelin-fixed/build/Packages/SHA256SUMS-support
          if-no-files-found: error
          retention-days: 30
